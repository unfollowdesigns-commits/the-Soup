<!doctype html><html><head><meta charset="utf-8"><title>effect isolation</title>
<style>
 body{margin:0;background:#0e0d0c;font:11px/1.4 ui-monospace,monospace;color:#8a8377}
 .grid{display:grid;grid-template-columns:repeat(4,320px);gap:10px;padding:10px}
 figure{margin:0} canvas{display:block;background:#000}
 figcaption{padding:4px 0;letter-spacing:.1em;text-transform:uppercase;color:#a89f8e}
</style></head><body>
<div class="grid" id="grid"></div>
<script type="module">
  import { LabRenderer } from '/src/engine/renderer.ts';
  import { getMaterial } from '/src/lab/materials.ts';
  import { defaultRecipe, makeBurn } from '/src/lab/recipe.ts';
  import { makeHouseSpecimen } from '/src/lab/specimens.ts';

  window.__result = { status: 'running' };
  try {
    const src = makeHouseSpecimen('window', 1400, 933);
    const W = 320, H = 213;

    const cases = [
      ['control',      'kodak-portra', r => { r.grain.amount=0; r.halation.intensity=0; r.optics.vignette=0; r.diffusion.bloom=0; }],
      ['material only','kodak-portra', r => { r.grain.amount=0; r.halation.intensity=0; r.optics.vignette=0; r.diffusion.bloom=0; }],
      ['tri-x',        'kodak-tri-x',  r => { r.grain.amount=0; r.halation.intensity=0; r.optics.vignette=0; r.diffusion.bloom=0; }],
      ['velvia',       'fuji-velvia',  r => { r.grain.amount=0; r.halation.intensity=0; r.optics.vignette=0; r.diffusion.bloom=0; }],
      ['grain 0.5',    'kodak-tri-x',  r => { r.grain.amount=0.5; r.halation.intensity=0; r.optics.vignette=0; r.diffusion.bloom=0; }],
      ['grain 1.0',    'kodak-tri-x',  r => { r.grain.amount=1; r.halation.intensity=0; r.optics.vignette=0; r.diffusion.bloom=0; }],
      ['halation .5',  'kodak-vision3-500t', r => { r.grain.amount=0; r.halation.intensity=0.5; r.optics.vignette=0; r.diffusion.bloom=0; }],
      ['diffusion .4', 'kodak-portra', r => { r.grain.amount=0; r.halation.intensity=0; r.diffusion.softness=0.4; r.diffusion.bloom=0.3; r.optics.vignette=0; }],
      ['soup .35',     'kodak-portra', r => { r.grain.amount=0; r.halation.intensity=0; r.optics.vignette=0; r.diffusion.bloom=0; r.experimental.filmSoup=0.35; }],
      ['soup .7',      'kodak-portra', r => { r.grain.amount=0; r.halation.intensity=0; r.optics.vignette=0; r.diffusion.bloom=0; r.experimental.filmSoup=0.7; r.experimental.soupChemical='bleach'; }],
      ['burn',         'kodak-portra', r => { r.grain.amount=0; r.halation.intensity=0; r.optics.vignette=0; r.diffusion.bloom=0; r.burns=[makeBurn(0.7,0.36)]; }],
      ['leak .4',      'kodak-portra', r => { r.grain.amount=0; r.halation.intensity=0; r.optics.vignette=0; r.diffusion.bloom=0; r.experimental.lightLeak=0.4; }],
      ['dust .5',      'kodak-tri-x',  r => { r.grain.amount=0; r.halation.intensity=0; r.optics.vignette=0; r.diffusion.bloom=0; r.experimental.dust=0.5; }],
      ['scratch .5',   'kodak-tri-x',  r => { r.grain.amount=0; r.halation.intensity=0; r.optics.vignette=0; r.diffusion.bloom=0; r.experimental.scratches=0.5; }],
      ['cross process','kodak-ektachrome', r => { r.grain.amount=0.3; r.halation.intensity=0.2; r.optics.vignette=0; r.development.mode='cross-process'; }],
      ['full recipe',  'kodak-portra', r => { r.grain.amount=0.6; r.halation.intensity=0.4; r.optics.vignette=0.3; r.optics.chromatic=0.2; r.experimental.filmSoup=0.2; r.experimental.dust=0.3; }],
    ];

    const grid = document.getElementById('grid');
    let renderer = null;
    await new Promise(r => setTimeout(r, 800));

    for (const [label, matId, tune] of cases) {
      const fig = document.createElement('figure');
      const c = document.createElement('canvas');
      c.width = W; c.height = H; c.style.width = W+'px'; c.style.height = H+'px';
      const cap = document.createElement('figcaption'); cap.textContent = label;
      fig.append(c, cap); grid.append(fig);
      const r = new LabRenderer(c);
      r.setSource(src.canvas, src.width, src.height);
      r.resize(W, H, 1);
      await new Promise(res => setTimeout(res, 250));
      const rec = defaultRecipe(matId);
      tune(rec);
      const view = { zoom: 1, panX: 0, panY: 0,
        compare: label === 'material only' ? 'split' : 'single', split: 0.5, view: 'color' };
      r.render(rec, getMaterial(matId), view);
      renderer = r;
    }
    window.__result = { status: 'ok', glError: renderer.gl.getError(), damage: renderer.hasDamagePlates };
  } catch (e) {
    window.__result = { status: 'error', message: String(e && e.stack || e) };
  }
</script></body></html>
